name: PHP image tag audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  check-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: php2shell repo-audit . --format sarif --output php2shell-image-audit.sarif --fail-on high
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php2shell-image-audit
          path: php2shell-image-audit.sarif
      - name: Upload results to GitHub Code Scanning
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: php2shell-image-audit.sarif
