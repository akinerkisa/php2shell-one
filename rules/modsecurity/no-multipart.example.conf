# OPT-IN: only for a virtual host / endpoint which DOES NOT need multipart uploads.
# Do not deploy globally to web apps that accept file uploads.
# This partial risk-reduction policy is NOT a PHP2Shell fix.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*multipart/" \
  "id:21096180,phase:1,deny,status:403,log,t:none,msg:'Application does not accept multipart requests'"
