# PHP2Shell One | ModSecurity 2.x/3.x baseline template.
# NOT a CVE-2026-109618/109619 fix or complete exploit blocker.
# Enable only after verifying your app's normal request/body limits.
# Some servers set these directives elsewhere; resolve precedence before deploying.
SecRequestBodyAccess On
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
# CAUTION: Limits alone cannot bound all multipart parser work or prevent both CVEs.
# Additional limits should be enforced by the frontend and application as appropriate.
