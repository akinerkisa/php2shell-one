name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
        env:
          PHP2SHELL_RUN_LINUX_INTEGRATION: '1'
      - run: python -m compileall -q src
      - run: php2shell status
      - run: php2shell hunt --access-log examples/access.log --error-log examples/error.log --events-json examples/events.jsonl --format html --output /tmp/sample.html
      - run: php2shell repo-audit lab --format sarif --output /tmp/repo.sarif
